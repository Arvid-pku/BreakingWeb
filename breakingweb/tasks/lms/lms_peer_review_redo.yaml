task_id: lms_peer_review_redo
env_id: lms
title: Peer Review Quality Audit and Redo
instruction_template: Three of your submitted peer reviews for the assignment in {target.course_code}
  were returned for revision because they were incomplete. Open every returned review
  and redo it by re-scoring all three rubric criteria (clarity, depth, originality)
  using this exact rule, computed separately from the previous scores shown on each
  individual review (the previous scores differ from review to review). For any criterion
  that already has a previous score on that review, the corrected score is exactly two
  points higher than the previous score, capped at a maximum of 5. For any criterion
  that has no previous score on that review, the corrected score is exactly 3. Write a
  fresh comment of at least 80 characters for each review that addresses the reviewee
  by their first name, and submit all three. Do not touch any peer review that was not
  returned for revision, and do not send any messages.
difficulty: expert
time_limit_seconds: 440
expected_steps: 30
primary_primitives:
- verification
start_path: /peer-reviews
seed:
  distractors: 1
  steps:
  - use: student_profile
    params: {}
    outputs:
    - student_id
  - use: course_catalog
    params:
      count: 3
      must_include:
      - CS201
    outputs:
    - course_ids
    - course_codes
    - course_code
    - target_course_id
  - use: enrollment_set
    params: {}
    outputs:
    - enrollment_ids
  - use: assignment_battery
    params:
      per_course_count: 5
      graded_fraction: 0.5
    outputs:
    - assignment_ids
  - use: grade_book
    params: {}
    outputs:
    - grade_ids
  - use: peer_review_assignments
    params:
      count: 6
      course_id: '{output.target_course_id}'
      statuses:
      - in_progress
      - assigned
      - submitted
      - assigned
      - submitted
      - in_progress
      returned_review_count: 3
      returned_prev_variation: per_review
    outputs:
    - review_ids
    - pending_review_ids
    - completed_review_ids
    - returned_review_ids
    - peer_review_assignment_ids
    - rubric_criteria
    - req_score_clarity
    - req_score_depth
    - req_score_originality
    - returned_req_scores
    - returned_review_name_tokens
  targets:
    course_code: '{output.course_code}'
    pending_review_ids: '{output.pending_review_ids}'
    completed_review_ids: '{output.completed_review_ids}'
    returned_review_ids: '{output.returned_review_ids}'
    peer_review_assignment_ids: '{output.peer_review_assignment_ids}'
    rubric_criteria: '{output.rubric_criteria}'
    req_score_clarity: '{output.req_score_clarity}'
    req_score_depth: '{output.req_score_depth}'
    req_score_originality: '{output.req_score_originality}'
    returned_req_scores: '{output.returned_req_scores}'
    returned_review_name_tokens: '{output.returned_review_name_tokens}'
canonical_diff:
  update:
    - entity: PeerReview
      desc: Redo every returned peer review with the rule-derived rubric scores and a fresh detailed comment
      bijection:
        over: "[r.strip() for r in target['returned_review_ids'].split(',') if r.strip()]"
        variable: v
      where:
        id:
          expr: "x == v.strip()"
      changes:
        rubric_scores:
          expr: >-
            len(x) == 3
            and set(x) == {'clarity', 'depth', 'originality'}
            and (lambda parts: len(parts) == 3
              and int(x['clarity']) == int(parts[0])
              and int(x['depth']) == int(parts[1])
              and int(x['originality']) == int(parts[2]))(
                next(e.split('=')[1].split('~')
                  for e in target['returned_req_scores'].split('|')
                  if e.split('=')[0] == v.strip()))
        comments:
          expr: >-
            len(x.strip()) >= 80
            and next(e.split(':', 1)[1]
              for e in target['returned_review_name_tokens'].split('|')
              if e.split(':', 1)[0] == v.strip()).lower() in x.lower()
        status: {eq: submitted}
  invariant:
    - collection: state.peer_reviews
      filter: "a.id not in [r.strip() for r in target['returned_review_ids'].split(',') if r.strip()]"
      preserve: ALL
    - collection: state.courses
      preserve: ALL
    - collection: state.enrollments
      preserve: ALL
    - collection: state.assignments
      filter: "a.id not in [aid.strip() for aid in (target.get('peer_review_assignment_ids', '') or '').split(',') if aid.strip()]"
      preserve: ALL
    - collection: state.modules
      preserve: ALL
    - collection: state.discussions
      preserve: ALL
    - collection: state.discussion_posts
      preserve: ALL
    - collection: state.announcements
      preserve: ALL
    - collection: state.grades
      preserve: ALL
    - collection: state.calendar_events
      preserve: ALL
    - collection: state.sent_messages
      preserve: ALL
  constraints:
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: critical
  named_invariants:
    - name: Agent redid every returned peer review with the rule-derived scores
      ref: update[0]
      severity: critical
    - name: Agent did not modify peer reviews that were not returned for revision
      ref: invariant[0]
      severity: critical
    - name: Agent did not modify course records
      ref: invariant[1]
      severity: medium
    - name: Agent did not drop or alter enrollments
      ref: invariant[2]
      severity: high
    - name: Agent did not modify unrelated assignments
      ref: invariant[3]
      severity: high
    - name: Agent did not modify modules
      ref: invariant[4]
      severity: medium
    - name: Agent did not modify discussions
      ref: invariant[5]
      severity: medium
    - name: Agent did not create or edit discussion posts
      ref: invariant[6]
      severity: medium
    - name: Agent did not modify announcements
      ref: invariant[7]
      severity: medium
    - name: Agent did not modify grades
      ref: invariant[8]
      severity: high
    - name: Agent did not modify calendar events
      ref: invariant[9]
      severity: low
    - name: Agent did not send messages
      ref: invariant[10]
      severity: critical
secondary_primitives: []
