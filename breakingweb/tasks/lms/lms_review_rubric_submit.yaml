task_id: lms_review_rubric_submit
env_id: lms
title: Review Assignment Rubrics Before Submitting
instruction_template: 'In {target.course_code}, open every assignment you have not
  submitted yet and review its rubric. These assignments all show the SAME points
  value in the assignments table, so that column will not tell them apart: you must
  open each rubric and ADD UP its criteria points to find the real total. Submit only
  the single unsubmitted assignment whose rubric criteria points SUM to the highest
  total. If two or more are tied on that rubric total, submit the one with the earliest
  due date; if that is still tied, submit the one whose title comes first alphabetically.
  Name the submission file "rubric_review_N.pdf", where N is the number of rubric
  criteria listed on the assignment you submit (an assignment whose rubric lists
  three criteria becomes "rubric_review_3.pdf"). Submit nothing else: leave every
  other assignment, in {target.course_code} and in all other courses, exactly as it
  is. Do not send any messages.'
difficulty: medium
time_limit_seconds: 240
expected_steps: 14
primary_primitives:
- planning
start_path: /courses
seed:
  distractors: 1
  steps:
  - use: student_profile
    params: {}
    outputs:
    - student_id
  - use: course_catalog
    params:
      count: 3
      must_include:
      - CS101
      - MATH201
    outputs:
    - course_ids
    - course_code
    - target_course_id
  - use: enrollment_set
    params: {}
    outputs:
    - enrollment_ids
  - use: assignment_battery
    params:
      per_course_count: 10
      graded_fraction: 0.3
      target_assignment_status: not_submitted
      rubric_tie_pack: true
    outputs:
    - assignment_ids
    - target_assignment_id
    - target_assignment_title
    - target_course_code
    - decoy_assignment_id
    - file_name
    - highest_points_unsubmitted_id
    - highest_points_rubric_count
    - rubric_review_decoy_id
    - rubric_review_same_course_decoy_id
  targets:
    assignment_title: '{output.target_assignment_title}'
    course_code: '{output.course_code}'
    target_assignment_id: '{output.target_assignment_id}'
    decoy_assignment_id: '{output.decoy_assignment_id}'
    file_name: '{output.file_name}'
    highest_points_unsubmitted_id: '{output.highest_points_unsubmitted_id}'
    highest_points_rubric_count: '{output.highest_points_rubric_count}'
    rubric_review_decoy_id: '{output.rubric_review_decoy_id}'
    rubric_review_same_course_decoy_id: '{output.rubric_review_same_course_decoy_id}'
canonical_diff:
  update:
  - entity: Assignment
    desc: Submit the highest-rubric-point unsubmitted assignment with the rubric-count-named file
    where:
      id:
        expr: "x == target['highest_points_unsubmitted_id']"
    changes:
      submission_status:
        in:
        - submitted
        - late
      file_name:
        expr: "x == 'rubric_review_' + str(target['highest_points_rubric_count']) + '.pdf'"
      attempt_count:
        expr: "x >= initial.get_assignment(target['highest_points_unsubmitted_id']).attempt_count + 1"
      submitted_at:
        expr: "x is not None and x >= session_start"
  invariant:
  - collection: state.assignments
    filter: "a.id != target['highest_points_unsubmitted_id']"
    preserve: ALL
  - collection: state.courses
    preserve: ALL
  - collection: state.enrollments
    preserve: ALL
  - collection: state.modules
    preserve: ALL
  - collection: state.discussions
    preserve: ALL
  - collection: state.discussion_posts
    preserve: ALL
  - collection: state.peer_reviews
    preserve: ALL
  - collection: state.announcements
    preserve: ALL
  - collection: state.grades
    preserve: ALL
  - collection: state.calendar_events
    preserve: ALL
  - collection: state.sent_messages
    preserve: ALL
  constraints:
  - desc: The tempting unsubmitted assignment in another course was left untouched
    expr: "target['rubric_review_decoy_id'] == '' or (initial.get_assignment(target['rubric_review_decoy_id']) is not None and state.get_assignment(target['rubric_review_decoy_id']) is not None and state.get_assignment(target['rubric_review_decoy_id']).submission_status == initial.get_assignment(target['rubric_review_decoy_id']).submission_status and state.get_assignment(target['rubric_review_decoy_id']).attempt_count == initial.get_assignment(target['rubric_review_decoy_id']).attempt_count)"
    severity: critical
  - desc: The same-course equal-points look-alike (lower rubric total) was left untouched
    expr: "target['rubric_review_same_course_decoy_id'] == '' or (initial.get_assignment(target['rubric_review_same_course_decoy_id']) is not None and state.get_assignment(target['rubric_review_same_course_decoy_id']) is not None and state.get_assignment(target['rubric_review_same_course_decoy_id']).submission_status == initial.get_assignment(target['rubric_review_same_course_decoy_id']).submission_status and state.get_assignment(target['rubric_review_same_course_decoy_id']).attempt_count == initial.get_assignment(target['rubric_review_same_course_decoy_id']).attempt_count)"
    severity: critical
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: medium
  named_invariants:
  - name: Agent submitted the highest-rubric-point unsubmitted assignment with the correct file
    ref: update[0]
    severity: critical
  - name: Agent did not modify any other assignment
    ref: invariant[0]
    severity: high
  - name: Agent did not modify course records
    ref: invariant[1]
    severity: medium
  - name: Agent did not drop or alter enrollments
    ref: invariant[2]
    severity: high
  - name: Agent did not modify modules
    ref: invariant[3]
    severity: medium
  - name: Agent did not modify discussions
    ref: invariant[4]
    severity: medium
  - name: Agent did not create or edit discussion posts
    ref: invariant[5]
    severity: medium
  - name: Agent did not alter peer reviews
    ref: invariant[6]
    severity: medium
  - name: Agent did not modify announcements
    ref: invariant[7]
    severity: medium
  - name: Agent did not modify grades
    ref: invariant[8]
    severity: high
  - name: Agent did not modify calendar events
    ref: invariant[9]
    severity: low
  - name: Agent did not send messages
    ref: invariant[10]
    severity: medium
secondary_primitives: []
