task_id: lms_read_urgent_announcement
env_id: lms
title: Read Urgent Announcement
instruction_template: >-
  Your announcements feed is busy: there are several urgent notices and several
  recent notices, some already read. Open the feed and mark as read the single
  announcement that satisfies ALL THREE conditions: its priority is urgent, it is
  still unread, and it has the latest posted_at among the announcements that meet
  both of those conditions. Be careful: the most recently posted urgent
  announcement overall has already been read (it is NOT your target), and the
  most recently posted unread announcement overall is only normal priority (also
  NOT your target). Mark exactly that one announcement read. Do not mark any
  other announcement read, do not use mark-all-read, and do not send any
  messages.
difficulty: medium
time_limit_seconds: 180
expected_steps: 10
primary_primitives:
  - grounding
start_path: /courses

seed:
  distractors: 0
  steps:
    - use: student_profile
      params: {}
      outputs:
        - student_id
    - use: course_catalog
      params:
        count: 5
      outputs:
        - course_ids
    - use: enrollment_set
      params: {}
      outputs:
        - enrollment_ids
    - use: announcements_feed
      params:
        count: 15
        unread_count: 9
        urgent_count: 6
        distinct_urgent_recency: true
        tight_recency: true
        urgent_read_decoy_count: 2
        normal_late_decoy_count: 1
      outputs:
        - announcement_ids
        - unread_announcement_ids
        - urgent_announcement_id
        - urgent_unread_announcement_ids
        - target_urgent_announcement_id
        - latest_announcement_id
  targets:
    urgent_announcement_id: '{output.urgent_announcement_id}'
    unread_announcement_ids: '{output.unread_announcement_ids}'
    urgent_unread_announcement_ids: '{output.urgent_unread_announcement_ids}'
    target_urgent_announcement_id: '{output.target_urgent_announcement_id}'
    latest_announcement_id: '{output.latest_announcement_id}'

canonical_diff:
  update:
    - entity: Announcement
      desc: Mark the most recently posted urgent unread announcement as read
      where:
        id:
          expr: "x == target['target_urgent_announcement_id']"
        priority:
          eq: urgent
      changes:
        is_read: {eq: true}
  invariant:
    - collection: state.announcements
      filter: "a.id != target['target_urgent_announcement_id']"
      preserve: ALL
    - collection: state.courses
      preserve: ALL
    - collection: state.enrollments
      preserve: ALL
    - collection: state.assignments
      preserve: ALL
    - collection: state.modules
      preserve: ALL
    - collection: state.discussions
      preserve: ALL
    - collection: state.discussion_posts
      preserve: ALL
    - collection: state.peer_reviews
      preserve: ALL
    - collection: state.grades
      preserve: ALL
    - collection: state.calendar_events
      preserve: ALL
    - collection: state.sent_messages
      preserve: ALL
  constraints:
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: high
  - desc: Other urgent unread announcements were left unread (no mark-all-read)
    expr: >-
      sum(1 for a in state.announcements if a.priority == 'urgent'
      and not a.is_read) == len(target['urgent_unread_announcement_ids'].split(','))
      - 1
    severity: critical
  - desc: The newest already-read urgent decoy stayed read (agent did not target it)
    expr: >-
      all(a.is_read for a in state.announcements if a.priority == 'urgent'
      and a.id not in target['urgent_unread_announcement_ids'].split(','))
    severity: critical

  named_invariants:
    - name: Agent did not modify non-target announcements
      ref: invariant[0]
      severity: critical
    - name: Agent did not modify course records
      ref: invariant[1]
      severity: medium
    - name: Agent did not drop or alter enrollments
      ref: invariant[2]
      severity: high
    - name: Agent did not modify assignments
      ref: invariant[3]
      severity: medium
    - name: Agent did not modify modules
      ref: invariant[4]
      severity: medium
    - name: Agent did not modify discussions
      ref: invariant[5]
      severity: medium
    - name: Agent did not create or edit discussion posts
      ref: invariant[6]
      severity: medium
    - name: Agent did not alter peer reviews
      ref: invariant[7]
      severity: medium
    - name: Agent did not modify grades
      ref: invariant[8]
      severity: high
    - name: Agent did not modify calendar events
      ref: invariant[9]
      severity: low
    - name: Agent did not send messages
      ref: invariant[10]
      severity: medium
