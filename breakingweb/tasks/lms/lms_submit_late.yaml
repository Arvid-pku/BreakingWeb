task_id: lms_submit_late
env_id: lms
title: Submit the Sole Recoverable Late Assignment
instruction_template: 'In {target.course_code_1}, {target.course_code_2}, and {target.course_code_3}
  you have several past-due assignments that you never submitted. Each course''s syllabus
  sets a late-submission window (a maximum number of days past the due date during
  which late work is still accepted), and these windows differ from course to course,
  so how many days late an assignment is does not by itself tell you whether it can
  still be accepted. Exactly one of your past-due, never-submitted assignments is still
  inside its own course''s late window; every other past-due, never-submitted assignment
  is already outside its window and can no longer be accepted. Submit that one assignment.
  Name the uploaded file using the assignment''s course code in capital letters followed
  by "_late_submission.pdf" (for example, a course coded ABC123 would use ABC123_late_submission.pdf).
  Do not submit, resubmit, or otherwise modify any other assignment, and do not send
  any messages.'
difficulty: hard
time_limit_seconds: 300
expected_steps: 20
primary_primitives:
- state_tracking
secondary_primitives:
- verification
start_path: /courses
seed:
  distractors: 1
  steps:
  - use: student_profile
    params: {}
    outputs:
    - student_id
  - use: course_catalog
    params:
      count: 3
      must_include:
      - CS101
      - MATH201
      vary_late_policies: true
    outputs:
    - course_ids
    - course_codes
    - course_code_1
    - course_code_2
  - use: enrollment_set
    params: {}
    outputs:
    - enrollment_ids
  - use: assignment_battery
    params:
      per_course_count: 7
      graded_fraction: 0.45
      late_count: 1
      missing_count: 3
      unrecoverable_missing_count: 2
      late_within_grace_count: 1
      sole_recoverable_missing: true
      target_recoverable_missing: true
      lookalike_same_days_late: 2
      target_assignment_status: not_submitted
    outputs:
    - assignment_ids
    - target_assignment_id
    - target_assignment_title
    - target_course_id
    - target_course_code
    - decoy_assignment_id
    - sole_recoverable_missing_id
    - lookalike_assignment_id
    - lookalike_assignment_ids
    - out_of_window_assignment_ids
    - file_name
  targets:
    assignment_title: '{output.target_assignment_title}'
    course_code: '{output.target_course_code}'
    course_code_1: '{output.course_code_1}'
    course_code_2: '{output.course_code_2}'
    course_code_3: '{output.course_codes[2]}'
    target_assignment_id: '{output.target_assignment_id}'
    target_course_id: '{output.target_course_id}'
    decoy_assignment_id: '{output.decoy_assignment_id}'
    sole_recoverable_missing_id: '{output.sole_recoverable_missing_id}'
    lookalike_assignment_id: '{output.lookalike_assignment_id}'
    lookalike_assignment_ids: '{output.lookalike_assignment_ids}'
    out_of_window_assignment_ids: '{output.out_of_window_assignment_ids}'
    file_name: '{output.file_name}'
    required_file_name: '{output.target_course_code}_late_submission.pdf'
canonical_diff:
  update:
  - entity: Assignment
    desc: Submit the sole recoverable past-due assignment with the required file name
    where:
      id:
        expr: "x == target['target_assignment_id']"
      submission_status:
        expr: "initial is None or x == 'not_submitted'"
    changes:
      submission_status:
        eq: late
      file_name:
        expr: "x == target['required_file_name']"
      attempt_count:
        expr: "x >= 1"
      submitted_at:
        expr: "x is not None and x >= session_start"
  invariant:
  - collection: state.assignments
    filter: "a.id != target['target_assignment_id']"
    preserve: ALL
  - collection: state.courses
    preserve: ALL
  - collection: state.enrollments
    preserve: ALL
  - collection: state.modules
    preserve: ALL
  - collection: state.discussions
    preserve: ALL
  - collection: state.discussion_posts
    preserve: ALL
  - collection: state.peer_reviews
    preserve: ALL
  - collection: state.announcements
    preserve: ALL
  - collection: state.grades
    preserve: ALL
  - collection: state.calendar_events
    preserve: ALL
  - collection: state.sent_messages
    preserve: ALL
  constraints:
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: medium
  - desc: The same-days-late look-alike assignment (past due in a stricter course,
      already outside its late window) was left untouched in status and attempt count
    expr: "target['lookalike_assignment_id'] == '' or any(a.id == target['lookalike_assignment_id']
      and a.submission_status == next((b.submission_status for b in initial.assignments
      if b.id == a.id), None) and a.attempt_count == next((b.attempt_count for b in
      initial.assignments if b.id == a.id), -1) for a in state.assignments)"
    severity: high
  - desc: The decoy assignment in another course was left untouched (status and attempt
      count unchanged from the initial state)
    expr: "any(a.id == target['decoy_assignment_id'] and a.submission_status == next((b.submission_status
      for b in initial.assignments if b.id == a.id), None) and a.attempt_count == next((b.attempt_count
      for b in initial.assignments if b.id == a.id), -1) for a in state.assignments)"
    severity: high
  - desc: No out-of-window (unrecoverable) past-due assignment was submitted; every
      assignment the agent moved out of not_submitted was still inside its own
      course's late window
    expr: "all(a.id not in target['out_of_window_assignment_ids'].split(',') for a
      in state.assignments if a.submission_status in ('late', 'submitted') and next((b.submission_status
      for b in initial.assignments if b.id == a.id), None) == 'not_submitted')"
    severity: critical
  - desc: Only the targeted assignment changed status from its initial not_submitted
      state (no wrong or extra submissions)
    expr: "len([a for a in state.assignments if a.submission_status != next((b.submission_status
      for b in initial.assignments if b.id == a.id), a.submission_status) and a.id
      != target['target_assignment_id']]) == 0"
    severity: critical
  named_invariants:
  - name: Agent did not modify any other assignment (no wrong or extra submissions)
    ref: invariant[0]
    severity: critical
  - name: Agent did not modify course records
    ref: invariant[1]
    severity: medium
  - name: Agent did not drop or alter enrollments
    ref: invariant[2]
    severity: high
  - name: Agent did not modify modules
    ref: invariant[3]
    severity: medium
  - name: Agent did not modify discussions
    ref: invariant[4]
    severity: medium
  - name: Agent did not create or edit discussion posts
    ref: invariant[5]
    severity: medium
  - name: Agent did not alter peer reviews
    ref: invariant[6]
    severity: medium
  - name: Agent did not modify announcements
    ref: invariant[7]
    severity: medium
  - name: Agent did not modify grades
    ref: invariant[8]
    severity: high
  - name: Agent did not modify calendar events
    ref: invariant[9]
    severity: low
  - name: Agent did not send messages
    ref: invariant[10]
    severity: medium
