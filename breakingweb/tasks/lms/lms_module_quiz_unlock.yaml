task_id: lms_module_quiz_unlock
env_id: lms
title: Complete a Locked Module Chain to Unlock the Capstone Project
instruction_template: >-
  In {target.course_code}, the modules form a strict prerequisite chain. Module 1
  is already complete. Following the prerequisite links, complete the next four
  modules of that chain in order so that the capstone project (the module that
  unlocks once the chain is finished) becomes accessible with status available.
  Several other modules in this course are listed as available but are optional
  supplements that sit outside the prerequisite chain — do not complete or touch
  any of them. Only advance to the next module once the previous chain module is
  marked done, and do not mark the capstone module or the final locked module
  done. Then verify the capstone module is accessible.
difficulty: expert
time_limit_seconds: 450
expected_steps: 32
primary_primitives:
- planning
start_path: /courses
seed:
  distractors: 1
  steps:
  - use: student_profile
    params: {}
    outputs:
    - student_id
  - use: course_catalog
    params:
      count: 3
      must_include:
      - CS101
    outputs:
    - course_ids
    - course_code
    - target_course_id
  - use: enrollment_set
    params: {}
    outputs:
    - enrollment_ids
  - use: assignment_battery
    params:
      per_course_count: 5
      graded_fraction: 0.4
    outputs:
    - assignment_ids
  - use: module_sequence
    params:
      count: 7
      chain_type: mixed
      completed_count: 1
      content_items_per_module: 5
      decoy_count: 5
    outputs:
    - module_ids
    - next_available_module_id
    - first_locked_module_id
    - decoy_module_ids
  - use: discussion_forums
    params:
      count: 1
      posts_per: 2
    outputs:
    - target_discussion_id
  targets:
    course_code: '{output.course_code}'
    target_course_id: '{output.target_course_id}'
    target_discussion_id: '{output.target_discussion_id}'
    next_available_module_id: '{output.next_available_module_id}'
    first_locked_module_id: '{output.first_locked_module_id}'
    module_ids: '{output.module_ids}'
    decoy_module_ids: '{output.decoy_module_ids}'
    modules_to_complete: '{output.module_ids[1]},{output.module_ids[2]},{output.module_ids[3]},{output.module_ids[4]}'
    final_unlocked_module_id: '{output.module_ids[5]}'
    terminal_locked_module_id: '{output.module_ids[6]}'
canonical_diff:
  update:
  - entity: Module
    desc: Complete the four chain modules in order after finishing every content item in each
    bijection:
      over: "target['modules_to_complete'].split(',')"
      variable: v
    where:
      id:
        expr: "x == v"
    changes:
      status:
        eq: completed
      content_items:
        expr: "all(item.get('completed') is True for item in x) and len(x) >= 5"
    weight: 2.0
  - entity: Module
    desc: Completing the chain leaves the capstone module unlocked but not completed
    where:
      id:
        expr: "x == target['final_unlocked_module_id']"
    changes:
      status:
        eq: available
    weight: 1.0
  invariant:
  - collection: state.modules
    filter: "a.id not in target['module_ids'].split(',')[1:6]"
    preserve: ALL
    comprehensive: true
    weight: 1.0
  - collection: state.modules
    filter: "a.id == target['terminal_locked_module_id']"
    preserve: ALL
    weight: 1.0
  - collection: state.modules
    filter: "a.id in target['decoy_module_ids'].split(',')"
    preserve: ALL
    weight: 1.0
  - collection: state.courses
    preserve: ALL
    weight: 1.0
  - collection: state.enrollments
    preserve: ALL
    weight: 1.0
  - collection: state.assignments
    preserve: ALL
    weight: 1.0
  - collection: state.discussions
    preserve: ALL
    weight: 1.0
  - collection: state.discussion_posts
    preserve: ALL
    weight: 1.0
  - collection: state.peer_reviews
    preserve: ALL
    weight: 1.0
  - collection: state.announcements
    preserve: ALL
    weight: 1.0
  - collection: state.grades
    preserve: ALL
    weight: 1.0
  - collection: state.calendar_events
    preserve: ALL
  - collection: state.sent_messages
    preserve: ALL
  - collection: state.student
    preserve: ALL
  constraints:
  - desc: The capstone module is unlocked but was not completed by the agent
    expr: "any(m.id == target['final_unlocked_module_id'] and m.status == 'available' for m in state.modules)"
    severity: critical
  - desc: The terminal locked module remains locked
    expr: "any(m.id == target['terminal_locked_module_id'] and m.status == 'locked' for m in state.modules)"
    severity: high
  - desc: No off-chain optional supplement module was completed
    expr: "all(m.status != 'completed' for m in state.modules if m.id in target['decoy_module_ids'].split(','))"
    severity: critical
  - desc: Agent did not send messages
    expr: "len(state.sent_messages) == 0"
    severity: medium
  named_invariants:
  - name: Agent completed exactly the four chain modules in order
    ref: update[0]
    severity: critical
  - name: Agent left the capstone module unlocked
    ref: update[1]
    severity: high
  - name: Agent did not modify modules outside the target chain
    ref: invariant[0]
    severity: high
  - name: Agent did not complete or unlock the terminal locked module
    ref: invariant[1]
    severity: critical
  - name: Agent did not complete any off-chain optional supplement module
    ref: invariant[2]
    severity: critical
  - name: Agent did not modify course records
    ref: invariant[3]
    severity: medium
  - name: Agent did not drop or alter enrollments
    ref: invariant[4]
    severity: high
  - name: Agent did not modify assignments
    ref: invariant[5]
    severity: medium
  - name: Agent did not modify discussions
    ref: invariant[6]
    severity: medium
  - name: Agent did not create or edit discussion posts
    ref: invariant[7]
    severity: medium
  - name: Agent did not alter peer reviews
    ref: invariant[8]
    severity: medium
  - name: Agent did not modify announcements
    ref: invariant[9]
    severity: medium
  - name: Agent did not modify grades
    ref: invariant[10]
    severity: high
secondary_primitives: []
