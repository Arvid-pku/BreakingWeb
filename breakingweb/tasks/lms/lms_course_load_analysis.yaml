task_id: lms_course_load_analysis
env_id: lms
title: Course Load Analysis for Adding a Fifth Course
instruction_template: 'You are considering adding one more course next term and
  must decide whether it is safe to add. Use the standard credit-weighted GPA rule:
  a cumulative GPA is the credit-weighted average of grade points, so projecting a
  new course means folding its grade points and credits into your current totals.
  Read your cumulative GPA from your Profile. Then determine your current total
  credit hours by summing the credit hours of ONLY the courses you are actively
  enrolled in right now (status enrolled) -- do not count any course you are merely
  waitlisted for, have completed, or have dropped, even if it still appears in your
  records. Model the prospective course as a 3-credit course in which you would earn
  a grade of C. Derive the projected cumulative GPA from your current GPA, your
  current enrolled credit total, and that new 3-credit C. If the projected
  cumulative GPA is at or above 3.0, adding the course is safe: in that case mark
  every unread announcement as read and make no other changes. If the projected
  cumulative GPA falls below 3.0, adding the course is NOT safe: in that case do NOT
  touch any announcement and instead drop exactly the single enrolled course in
  which you currently have the lowest weighted grade. To identify it, recompute each
  enrolled course''s current weighted grade from its graded work and that course''s
  grading-policy category weights, honoring any drop-lowest rule in the policy; the
  lowest-weighted-grade course among your enrolled courses is the one to drop. Do
  not enroll in or create any new course, do not modify any grade, and do not send
  any message.'
difficulty: expert
time_limit_seconds: 420
expected_steps: 26
primary_primitives:
- planning
start_path: /dashboard
seed:
  distractors: 1
  steps:
  - use: student_profile
    params:
      gpa: '3.20'
    outputs:
    - student_id
    - advisor_name
    - gpa
  - use: course_catalog
    params:
      count: 5
      must_include:
      - MATH201
      - PHYS201
      - CS101
      grading_template_indices:
      - 1
      - 0
      - 0
      - 2
      - 3
    outputs:
    - course_ids
    - course_codes
  - use: enrollment_set
    params:
      include_waitlisted: true
    outputs:
    - enrollment_ids
  - use: assignment_battery
    params:
      per_course_count: 8
      graded_fraction: 0.375
    outputs:
    - assignment_ids
  - use: grade_book
    params:
      enrolled_scoped_decision: true
    outputs:
    - grade_ids
    - current_weighted_scores
    - can_add_course
    - lowest_performing_course_id
    - lower_grade_enrollment_id
    - current_total_credits
    - all_courses_total_credits
    - projected_gpa
  - use: calendar_events
    params:
      include_recurring: false
    outputs:
    - event_ids
  - use: announcements_feed
    params: {}
    outputs:
    - announcement_ids
    - unread_announcement_ids
  targets:
    gpa: '{output.gpa}'
    num_courses: '4'
    can_add_course: '{output.can_add_course}'
    lowest_performing_course_id: '{output.lowest_performing_course_id}'
    lower_grade_enrollment_id: '{output.lower_grade_enrollment_id}'
    unread_announcement_ids: '{output.unread_announcement_ids}'
    current_total_credits: '{output.current_total_credits}'
    all_courses_total_credits: '{output.all_courses_total_credits}'
    projected_gpa: '{output.projected_gpa}'
canonical_diff:
  oneof:
  # Branch 1 — "safe to add": projected GPA >= 3.0 (can_add_course == 'true').
  # The agent must RE-DERIVE the projected GPA; the flag is never shown. The
  # bijection produces one read slot per unread announcement; the where-clause
  # only matches when the discriminator allows this branch, so an agent that
  # mis-computes the GPA and marks announcements on the wrong branch scores zero
  # AND trips the drop-branch enrollment invariant.
  - update:
    - entity: Announcement
      desc: Mark all unread announcements as read after confirming the projected GPA is at or above 3.0
      bijection:
        over: "target['unread_announcement_ids'].split(',') if target['unread_announcement_ids'] else []"
        variable: v
      where:
        id:
          expr: "x == v and target['can_add_course'] == 'true'"
      changes:
        is_read:
          eq: true
    invariant:
    - collection: state.announcements
      filter: "a.id not in (target['unread_announcement_ids'].split(',') if target['unread_announcement_ids'] else [])"
      preserve: ALL
    - collection: state.courses
      preserve: ALL
    - collection: state.enrollments
      preserve: ALL
    - collection: state.assignments
      preserve: ALL
    - collection: state.modules
      preserve: ALL
    - collection: state.discussions
      preserve: ALL
    - collection: state.discussion_posts
      preserve: ALL
    - collection: state.peer_reviews
      preserve: ALL
    - collection: state.grades
      preserve: ALL
    - collection: state.calendar_events
      preserve: ALL
    - collection: state.sent_messages
      preserve: ALL
    constraints:
    - desc: Agent did not send messages
      expr: "len(state.sent_messages) == 0"
      severity: critical
    - desc: Agent did not enroll in or create any new course
      expr: "len(state.enrollments) == len(initial.enrollments)"
      severity: critical
    - desc: Every enrollment remains in its original status (no course dropped on the safe branch)
      expr: "all(e.status == g.status for e in state.enrollments for g in initial.enrollments if e.id == g.id)"
      severity: critical
    - desc: No grade score was altered
      expr: "all(str(gr.score) == str(ig.score) for gr in state.grades for ig in initial.grades if gr.id == ig.id)"
      severity: high
    named_invariants:
    - name: Agent marked all unread announcements as read
      ref: update[0]
      severity: critical
    - name: Agent did not modify already-read announcements
      ref: invariant[0]
      severity: high
    - name: Agent did not modify course records
      ref: invariant[1]
      severity: medium
    - name: Agent did not drop or alter enrollments
      ref: invariant[2]
      severity: critical
    - name: Agent did not modify assignments
      ref: invariant[3]
      severity: medium
    - name: Agent did not modify modules
      ref: invariant[4]
      severity: medium
    - name: Agent did not modify discussions
      ref: invariant[5]
      severity: medium
    - name: Agent did not create or edit discussion posts
      ref: invariant[6]
      severity: medium
    - name: Agent did not alter peer reviews
      ref: invariant[7]
      severity: medium
    - name: Agent did not modify grades
      ref: invariant[8]
      severity: high
    - name: Agent did not modify calendar events
      ref: invariant[9]
      severity: low
    - name: Agent did not send messages
      ref: invariant[10]
      severity: medium
  # Branch 2 — "not safe to add": projected GPA < 3.0 (can_add_course == 'false').
  # The agent must RE-DERIVE both the projected GPA (to reach this branch) AND the
  # lowest-weighted-grade course (to pick the drop target). Reaching this branch at
  # all requires summing credits over ONLY the actively-enrolled courses: an agent
  # that also counts the waitlisted decoy course inflates current_total_credits,
  # computes a projected GPA >= 3.0, takes the SAFE branch instead, and so both
  # misses this drop AND trips the safe branch's announcement invariant. The
  # where-clause discriminator rejects the wrong branch, the wrong drop target is
  # frozen by the filtered enrollment invariant, and dropping the waitlisted decoy
  # (the credit-scope confusion surfacing as the wrong action) is rejected by the
  # critical "only an enrolled course was dropped" constraint below.
  - update:
    - entity: Enrollment
      desc: Drop the single lowest-weighted-grade currently-enrolled course (projected GPA falls below 3.0, so the prospective course cannot be added)
      where:
        course_id:
          expr: "x == target['lowest_performing_course_id'] and target['can_add_course'] == 'false'"
      changes:
        status:
          eq: dropped
    invariant:
    - collection: state.announcements
      preserve: ALL
    - collection: state.courses
      preserve: ALL
    - collection: state.enrollments
      filter: "a.course_id != target['lowest_performing_course_id']"
      preserve: ALL
    - collection: state.assignments
      preserve: ALL
    - collection: state.modules
      preserve: ALL
    - collection: state.discussions
      preserve: ALL
    - collection: state.discussion_posts
      preserve: ALL
    - collection: state.peer_reviews
      preserve: ALL
    - collection: state.grades
      preserve: ALL
    - collection: state.calendar_events
      preserve: ALL
    - collection: state.sent_messages
      preserve: ALL
    - collection: state.student
      preserve: ALL
    constraints:
    - desc: Agent did not send messages
      expr: "len(state.sent_messages) == 0"
      severity: critical
    - desc: Agent did not enroll in or create any new course
      expr: "len(state.enrollments) == len(initial.enrollments)"
      severity: critical
    - desc: Exactly one enrollment was dropped
      expr: "len([e for e in state.enrollments if e.status == 'dropped']) == len([e for e in initial.enrollments if e.status == 'dropped']) + 1"
      severity: critical
    - desc: The only newly-dropped course was one the student was actively enrolled in (not the waitlisted decoy course)
      expr: "all(ig.status == 'enrolled' for e in state.enrollments if e.status == 'dropped' for ig in initial.enrollments if ig.id == e.id and ig.status != 'dropped')"
      severity: critical
    - desc: The waitlisted course was left untouched (it does not count toward the enrolled credit load)
      expr: "all(e.status == ig.status for e in state.enrollments for ig in initial.enrollments if e.id == ig.id and ig.status == 'waitlisted')"
      severity: high
    - desc: No grade score was altered
      expr: "all(str(gr.score) == str(ig.score) for gr in state.grades for ig in initial.grades if gr.id == ig.id)"
      severity: high
    named_invariants:
    - name: Agent dropped the lowest-weighted-grade course enrollment
      ref: update[0]
      severity: critical
    - name: Agent did not modify announcements
      ref: invariant[0]
      severity: high
    - name: Agent did not modify course records
      ref: invariant[1]
      severity: medium
    - name: Agent did not modify enrollments other than the target course
      ref: invariant[2]
      severity: critical
    - name: Agent did not modify assignments
      ref: invariant[3]
      severity: medium
    - name: Agent did not modify modules
      ref: invariant[4]
      severity: medium
    - name: Agent did not modify discussions
      ref: invariant[5]
      severity: medium
    - name: Agent did not create or edit discussion posts
      ref: invariant[6]
      severity: medium
    - name: Agent did not alter peer reviews
      ref: invariant[7]
      severity: medium
    - name: Agent did not modify grades
      ref: invariant[8]
      severity: high
    - name: Agent did not modify calendar events
      ref: invariant[9]
      severity: low
    - name: Agent did not send messages
      ref: invariant[10]
      severity: medium
secondary_primitives: []
