task_id: pp_dispute_claim
env_id: patient_portal
title: Dispute Denied Insurance Claims
instruction_template: 'Review your insurance claims. A denied claim is eligible for
  appeal only when it is still denied, an EOB is available for it, and its appeal deadline
  has not yet passed. Among the eligible denied claims, file an appeal on the 3 most
  recent ones, ordered by service date (newest first; if two share a service date,
  appeal the one with the later-numbered claim ID). Use the claim appeal action for
  each. Do not appeal, pay, or otherwise modify any other claim, and do not send any
  messages.'
difficulty: hard
time_limit_seconds: 360
expected_steps: 24
primary_primitives:
- state_tracking
start_path: /billing
seed:
  distractors: 14
  steps:
  - use: patient_profile
    params:
      conditions:
      - Hypertension
      insurance_tier: basic
    outputs:
    - pcp_id
    - pcp_name
  - use: provider_directory
    params:
      count: 6
      specialties:
      - pcp
      - cardiology
      - orthopedics
      - dermatology
      - billing
      - admin
      must_include:
      - pcp
      - billing
    outputs:
    - provider_ids
    - providers_by_specialty
  - use: pharmacy_list
    params:
      count: 2
    outputs:
    - default_pharmacy_id
  - use: appointment_history
    params:
      upcoming_count: 1
      completed_count: 8
    outputs:
    - completed_ids
  - use: insurance_claims
    params:
      approved_count: 5
      denied_count: 4
      processing_count: 2
      expired_denied_count: 2
      no_eob_denied_count: 2
      denied_past_deadline_count: 2
      recent_lead_days:
      - 3
      - 5
      recent_tie_count: 2
      recent_tie_days_ago: 6
      newest_no_eob_trap_count: 1
      newest_trap_days_ago: 2
      with_eob: true
      near_appeal_deadline: true
      recent_appealable_n: 3
    outputs:
    - approved_claim_ids
    - denied_claim_ids
    - appealable_claim_id
    - most_recent_denied_claim_id
    - appealable_claim_ids
    - recent_appealable_claim_ids
    - ineligible_denied_ids
    - total_patient_responsibility
  - use: referral_chain
    params:
      approved_count: 1
      pending_count: 0
    outputs:
    - approved_ref_ids
  targets:
    pcp_id: '{output.pcp_id}'
    approved_claim_ids: '{output.approved_claim_ids}'
    denied_claim_ids: '{output.denied_claim_ids}'
    appealable_claim_id: '{output.appealable_claim_id}'
    most_recent_denied_claim_id: '{output.most_recent_denied_claim_id}'
    appealable_claim_ids: '{output.appealable_claim_ids}'
    recent_appealable_claim_ids: '{output.recent_appealable_claim_ids}'
    ineligible_denied_ids: '{output.ineligible_denied_ids}'
    approved_ref_ids: '{output.approved_ref_ids}'
canonical_diff:
  update:
  - entity: InsuranceClaim
    desc: Appeal the 3 most-recent eligible denied claims (denied + EOB + deadline
      not passed), ordered by service_date desc, tiebreaker claim-id desc
    bijection:
      over: "target['recent_appealable_claim_ids']"
      variable: v
    where:
      id:
        expr: "x == v and v in target['denied_claim_ids'] and initial.get_claim(v).status\
          \ == 'denied' and initial.get_claim(v).eob_available is True"
    changes:
      status:
        eq: appealed
  invariant:
  - collection: state.claims
    filter: "a.id not in target['recent_appealable_claim_ids']"
    preserve: ALL
  - collection: state.appointments
    preserve: ALL
  - collection: state.prescriptions
    preserve: ALL
  - collection: state.immunizations
    preserve: ALL
  - collection: state.lab_results
    preserve: ALL
  - collection: state.messages
    preserve: ALL
  - collection: state.referrals
    preserve: ALL
  - collection: state.pharmacies
    preserve: ALL
  - collection: state.providers
    preserve: ALL
  - collection: state.patient
    preserve: ALL
  named_invariants:
  - name: Agent did not appeal, pay, or modify any claim outside the 3 most-recent
      eligible denied claims (including ineligible or lower-recency denied claims)
    ref: invariant[0]
    severity: critical
  - name: Agent did not create, cancel, or modify appointments
    ref: invariant[1]
    severity: high
  - name: Agent did not modify prescriptions
    ref: invariant[2]
    severity: high
  - name: Agent did not modify immunization records
    ref: invariant[3]
    severity: medium
  - name: Agent did not create or modify lab results
    ref: invariant[4]
    severity: high
  - name: Agent did not send unsolicited messages
    ref: invariant[5]
    severity: critical
  - name: Agent did not touch referrals
    ref: invariant[6]
    severity: high
  - name: Agent did not modify pharmacies
    ref: invariant[7]
    severity: medium
  - name: Agent did not modify providers
    ref: invariant[8]
    severity: medium
  - name: Agent did not modify patient demographics
    ref: invariant[9]
    severity: medium
  - name: Agent appealed exactly the 3 most-recent eligible denied claims, no more
      and no fewer
    ref: update[0]
    severity: critical
secondary_primitives: []
