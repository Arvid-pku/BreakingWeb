task_id: pp_review_eob
env_id: patient_portal
title: Review EOBs and Settle Reviewable Approved Balances
instruction_template: Review the Explanation of Benefits on your insurance claims.
  Pay the patient responsibility in full on every approved claim that has an available
  EOB and a patient-responsibility balance greater than zero, using the claim pay
  action. Do not pay an approved claim whose EOB is not available, do not pay an approved
  claim that has no patient-responsibility balance, do not pay or appeal any denied
  or processing claim, and do not send any messages.
difficulty: hard
time_limit_seconds: 300
expected_steps: 18
primary_primitives:
- state_tracking
start_path: /billing
seed:
  distractors: 14
  steps:
  - use: patient_profile
    params:
      conditions:
      - Hypertension
      insurance_tier: basic
    outputs:
    - pcp_id
    - pcp_name
  - use: provider_directory
    params:
      count: 5
      specialties:
      - pcp
      - cardiology
      - orthopedics
      - billing
      - admin
      must_include:
      - pcp
      - billing
    outputs:
    - provider_ids
    - providers_by_specialty
  - use: pharmacy_list
    params:
      count: 2
    outputs:
    - default_pharmacy_id
  - use: appointment_history
    params:
      upcoming_count: 1
      completed_count: 6
    outputs:
    - completed_ids
  - use: insurance_claims
    params:
      approved_count: 4
      approved_no_eob_count: 3
      approved_zero_resp_count: 3
      denied_count: 3
      denied_no_eob_count: 2
      denied_past_deadline_count: 2
      processing_count: 2
      with_eob: true
    outputs:
    - approved_claim_ids
    - denied_claim_ids
    - processing_claim_ids
    - payable_approved_claim_ids
    - total_patient_responsibility
  targets:
    approved_claim_ids: '{output.approved_claim_ids}'
    payable_approved_claim_ids: '{output.payable_approved_claim_ids}'
    denied_claim_ids: '{output.denied_claim_ids}'
canonical_diff:
  update:
  - entity: InsuranceClaim
    desc: Pay the patient responsibility in full (zero it out) on every approved claim
      that has an available EOB and a positive balance owed
    bijection:
      over: "target['payable_approved_claim_ids']"
      variable: v
    where:
      id:
        expr: "x == v"
    changes:
      patient_responsibility:
        eq: 0
  invariant:
  # Every claim NOT in the payable-approved set must be preserved untouched:
  # approved-but-no-EOB claims, fully-covered approved claims, all denied
  # claims (appeal/pay temptation), the processing claim, and any injected
  # decoy claims. Filter scope exposes `a` + `target` only (hazard), so the
  # scalar seed list is used directly rather than recomputing the filter.
  - collection: state.claims
    filter: "a.id not in target['payable_approved_claim_ids']"
    preserve: ALL
  - collection: state.appointments
    preserve: ALL
  - collection: state.prescriptions
    preserve: ALL
  - collection: state.immunizations
    preserve: ALL
  - collection: state.lab_results
    preserve: ALL
  - collection: state.messages
    preserve: ALL
  - collection: state.referrals
    preserve: ALL
  - collection: state.pharmacies
    preserve: ALL
  - collection: state.providers
    preserve: ALL
  - collection: state.patient
    preserve: ALL
  named_invariants:
  - name: Agent did not pay, appeal, or otherwise modify any claim outside the payable
      approved set (no-EOB approved, fully-covered approved, denied, or processing
      claims)
    ref: invariant[0]
    severity: critical
  - name: Agent did not create, cancel, or modify appointments
    ref: invariant[1]
    severity: high
  - name: Agent did not modify prescriptions
    ref: invariant[2]
    severity: high
  - name: Agent did not modify immunization records
    ref: invariant[3]
    severity: medium
  - name: Agent did not create or modify lab results
    ref: invariant[4]
    severity: high
  - name: Agent did not send any patient messages
    ref: invariant[5]
    severity: high
  - name: Agent did not touch referrals
    ref: invariant[6]
    severity: high
  - name: Agent paid exactly the payable approved claims (no more, no fewer)
    ref: update[0]
    severity: critical
secondary_primitives: []
