task_id: pp_file_claim_appeal
env_id: patient_portal
title: File Claim Appeals for the Two Most-Urgent Denied Claims
instruction_template: Review every insurance claim on the account. A claim is eligible
  for appeal ONLY when all three of these are true at once - its status is denied, an
  EOB is available for it, and its appeal deadline has not yet passed. Some denied claims
  are NOT eligible (no EOB has been issued, or the appeal deadline has already passed)
  and must be left alone. Among the eligible claims, find the two whose appeal deadline
  is closest to now. Order the eligible claims by appeal deadline from earliest to latest;
  if two claims share the same appeal deadline, order those two by claim ID in ascending
  order. File an appeal on exactly those two most-urgent eligible claims using the claim
  appeal action, and on no others. Do not pay or appeal any other claim, do not modify
  or appeal any approved or processing claim, do not appeal any denied claim that lacks
  an EOB or whose deadline has passed, and do not send any messages.
difficulty: expert
time_limit_seconds: 450
expected_steps: 34
primary_primitives:
- state_tracking
start_path: /billing
seed:
  distractors: 10
  steps:
  - use: patient_profile
    params:
      conditions:
      - Hypertension
      - Back Pain
      insurance_tier: basic
    outputs:
    - pcp_id
    - pcp_name
  - use: provider_directory
    params:
      count: 7
      specialties:
      - pcp
      - cardiology
      - orthopedics
      - dermatology
      - radiology
      - billing
      - admin
      must_include:
      - pcp
      - billing
      - cardiology
    outputs:
    - provider_ids
    - providers_by_specialty
  - use: pharmacy_list
    params:
      count: 2
    outputs:
    - default_pharmacy_id
  - use: appointment_history
    params:
      upcoming_count: 1
      completed_count: 5
    outputs:
    - completed_ids
  - use: referral_chain
    params:
      approved_count: 2
      pending_count: 1
    outputs:
    - approved_ref_ids
    - pending_ref_ids
  - use: insurance_claims
    params:
      approved_count: 2
      denied_count: 6
      processing_count: 1
      with_eob: true
      near_appeal_deadline: true
      monotonic_appealable_deadlines: true
      no_eob_denied_count: 2
      denied_expired_count: 2
    outputs:
    - approved_claim_ids
    - denied_claim_ids
    - appealable_claim_id
    - top_2_urgent_appealable_claim_ids
    - appealable_claim_ids_by_deadline
    - rank1_appeal_deadline
    - rank2_appeal_deadline
    - rank2_boundary_deadline
    - rank1_tie_deadline
  targets:
    pcp_id: '{output.pcp_id}'
    approved_claim_ids: '{output.approved_claim_ids}'
    denied_claim_ids: '{output.denied_claim_ids}'
    appealable_claim_id: '{output.appealable_claim_id}'
    top_2_urgent_appealable_claim_ids: '{output.top_2_urgent_appealable_claim_ids}'
    appealable_claim_ids_by_deadline: '{output.appealable_claim_ids_by_deadline}'
    rank1_appeal_deadline: '{output.rank1_appeal_deadline}'
    rank2_appeal_deadline: '{output.rank2_appeal_deadline}'
    rank2_boundary_deadline: '{output.rank2_boundary_deadline}'
    rank1_tie_deadline: '{output.rank1_tie_deadline}'
    approved_ref_ids: '{output.approved_ref_ids}'
    completed_ids: '{output.completed_ids}'
canonical_diff:
  update:
    - entity: InsuranceClaim
      desc: "Appeal exactly the two most-urgent eligible denied claims (earliest appeal_deadline first, cid tiebreaker)"
      bijection:
        over: "target['top_2_urgent_appealable_claim_ids']"
        variable: v
      where:
        id:
          expr: "x == v"
      changes:
        status: {eq: appealed}
  invariant:
    # Every claim NOT in the two-most-urgent set must be preserved untouched:
    # this freezes the OTHER eligible denied claims (the most-tempting siblings),
    # plus all approved/processing claims and any variant decoy claims. The
    # filter scope exposes only `a` + `target` (no `initial`, no lambdas), so the
    # urgency-ranked set is precomputed in the seed builder as a scalar list.
    - collection: state.claims
      filter: "a.id not in target['top_2_urgent_appealable_claim_ids']"
      preserve: ALL
    - collection: state.appointments
      preserve: ALL
    - collection: state.prescriptions
      preserve: ALL
    - collection: state.immunizations
      preserve: ALL
    - collection: state.lab_results
      preserve: ALL
    - collection: state.messages
      preserve: ALL
    - collection: state.referrals
      preserve: ALL
    - collection: state.pharmacies
      preserve: ALL
    - collection: state.providers
      preserve: ALL
  named_invariants:
    - name: "Agent did not appeal, pay, or modify any claim outside the two most-urgent eligible set (incl. other appealable denied claims, approved, and processing claims)"
      ref: invariant[0]
      severity: critical
    - name: "Agent did not create, cancel, or modify appointments"
      ref: invariant[1]
      severity: high
    - name: "Agent did not modify prescriptions"
      ref: invariant[2]
      severity: high
    - name: "Agent did not modify immunization records"
      ref: invariant[3]
      severity: medium
    - name: "Agent did not create or modify lab results"
      ref: invariant[4]
      severity: high
    - name: "Agent did not send unsolicited messages"
      ref: invariant[5]
      severity: critical
    - name: "Agent did not touch referrals"
      ref: invariant[6]
      severity: high
    - name: "Agent did not modify pharmacies"
      ref: invariant[7]
      severity: medium
    - name: "Agent did not modify providers"
      ref: invariant[8]
      severity: medium
    - name: "Agent appealed exactly the two most-urgent eligible claims (no more, no fewer)"
      ref: update[0]
      severity: high
secondary_primitives: []
