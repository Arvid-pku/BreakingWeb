task_id: pp_respond_to_provider
env_id: patient_portal
title: Review Provider Message and Schedule Confirmed Follow-Up
instruction_template: 'Your inbox contains a message titled "Blood Pressure Medication
  Adjustment" from your assigned primary care physician (PCP) about adjusting your
  blood pressure medication. Do the following: 1) Open and read that exact message
  so it is marked as read. 2) Schedule exactly one follow-up appointment with the
  SAME PCP who sent that message (your assigned PCP), using that PCP''s earliest
  available in-person slot. Use the appointment reason exactly "Blood pressure medication
  adjustment follow-up". 3) After scheduling, confirm the appointment so its confirmation
  state becomes confirmed. Book in-person only, not telehealth. Do not book with any
  other primary care physician. Do not reply to the message and do not send any new
  messages.'
difficulty: hard
time_limit_seconds: 300
expected_steps: 16
primary_primitives:
- grounding
start_path: /messages
seed:
  distractors: 8
  steps:
  - use: patient_profile
    params:
      conditions:
      - Hypertension
      insurance_tier: standard
      # B-1 confirmation workflow: new PCP appointments land in
      # confirmation_state="pending"; the agent must POST /appointments/{id}/confirm
      # after scheduling so a single book-and-forget action is insufficient.
      auto_confirm_specialties:
      - pcp
    outputs:
    - pcp_id
    - pcp_name
  - use: provider_directory
    params:
      count: 5
      specialties:
      - pcp
      - cardiology
      - endocrinology
      - billing
      - admin
      must_include:
      - pcp
      # Two distinct PCPs: prov_1 is the patient's assigned PCP (and the
      # sender of the bp_medication_adjustment message); the second PCP is a
      # same-specialty decoy whose slots may be globally earlier. The agent
      # must book with the message sender (target.pcp_id == prov_1), NOT the
      # decoy PCP, so a naive "earliest PCP slot anywhere" answer is wrong.
      count_per_specialty:
        pcp: 2
      # Guarantee BOTH PCPs have at least one in-person slot so the canonical
      # answer ("assigned PCP's earliest in-person slot") always exists, and
      # the decoy PCP is a real bookable alternative the agent must reject.
      force_in_person_specialties:
      - pcp
      # MODALITY TRAP (deterministic across every seed): each PCP is guaranteed
      # to own a TELEHEALTH slot strictly EARLIER than its earliest in-person
      # slot. So the assigned PCP's globally-earliest slot is ALWAYS telehealth,
      # and "book the earliest slot of the assigned PCP" (ignoring modality) is
      # a concrete wrong answer on every seed — the in-person filter in the
      # datetime min-expr is now an active discriminator, not an occasionally
      # vacuous predicate. (Previously the trap only fired on the ~1/3 of seeds
      # where the RNG happened to draw an early telehealth slot, which made the
      # in-person gate a noisy difficulty signal.)
      force_earlier_telehealth_specialties:
      - pcp
    outputs:
    - provider_ids
    - providers_by_specialty
    - decoy_pcp_id
    - decoy_pcp_name
  - use: pharmacy_list
    params:
      count: 2
    outputs:
    - default_pharmacy_id
  - use: message_threads
    params:
      thread_count: 5
      unread_count: 3
      categories:
      - clinical
      - scheduling
      include_billing: true
      body_context:
        type: bp_medication_adjustment
    outputs:
    - thread_ids
    - unread_msg_ids
    - all_msg_ids
    - context_msg_ids
  targets:
    pcp_id: '{output.pcp_id}'
    pcp_name: '{output.pcp_name}'
    all_msg_ids: '{output.all_msg_ids}'
    thread_ids: '{output.thread_ids}'
    bp_msg_id: '{output.context_msg_ids.bp_medication_adjustment}'
    # All PCP provider ids in the directory (>=2). Exposed so the
    # bounded-creation / sibling invariants can reason about "the other PCP"
    # without recomputing a set inside a filter scope (Class 6 hazard).
    pcp_provider_ids: '{output.providers_by_specialty.pcp}'
    # The SECOND same-specialty PCP (the decoy / "other PCP"). Pinned as a
    # scalar so the bounded-create invariant and the grounding intervention
    # variant can reference the wrong-but-tempting provider directly. prov_1 is
    # always the assigned PCP, so this is providers_by_specialty.pcp[1].
    decoy_pcp_id: '{output.decoy_pcp_id}'
    decoy_pcp_name: '{output.decoy_pcp_name}'
canonical_diff:
  # Positive signals:
  #   (a) mark the PCP's "Blood Pressure Medication Adjustment" message
  #       (identified by seed output target.bp_msg_id) as read;
  #   (b) create exactly one PCP follow-up appointment with the assigned PCP
  #       (target.pcp_id == prov_1, the message sender) at THAT PCP's earliest
  #       available in-person slot, with the exact required reason, AND
  #   (c) confirm the appointment (confirmation_state == "confirmed") because
  #       the seed marks new PCP appointments as requires_confirmation.
  update:
    - entity: ClinicalMessage
      desc: "Mark the PCP's Blood Pressure Medication Adjustment message as read"
      where:
        # `where` only sees id + fields whose value changed, so match by id
        # against the deterministic target emitted by the message_threads
        # seed (the first provider message of the bp_medication_adjustment
        # thread). Identity (from_type / provider_id / subject) is enforced
        # at seed time and asserted by the end-to-end tests.
        id:
          expr: "x == target['bp_msg_id']"
      changes:
        is_read: {eq: true}
  create:
    - entity: Appointment
      desc: >-
        Schedule one in-person follow-up with the assigned PCP (the message
        sender, target.pcp_id) at that PCP's earliest in-person slot, then
        confirm it.
      properties:
        status: {eq: "scheduled"}
        type: {eq: "in-person"}
        provider_id:
          # Must be the assigned PCP (prov_1), i.e. the sender of the bp
          # message — NOT the decoy second PCP whose slots may be earlier.
          expr: "x == target['pcp_id']"
        reason: {eq: "Blood pressure medication adjustment follow-up"}
        # The seed places new PCP appointments in confirmation_state="pending"
        # (auto_confirm_specialties: [pcp]); the agent must call /confirm so
        # this becomes "confirmed". A scheduled-but-unconfirmed appointment fails.
        confirmation_state: {eq: "confirmed"}
        # PCP follow-ups need no referral; pin to null so a stray referral link
        # (copied from a decoy) is rejected.
        linked_referral_id: {eq: null}
        datetime:
          # Earliest IN-PERSON slot of the ASSIGNED PCP specifically. Filtering
          # to in-person matters because that PCP's slot list mixes modalities,
          # and scoping to target.pcp_id matters because a second PCP exists
          # whose bare-earliest slot would be the wrong answer.
          expr: >
            x == min(s.datetime for p in initial.providers
                     if p.id == target['pcp_id']
                     for s in p.available_slots
                     if s.type == 'in-person')
        notes: {any: true}
        pre_auth_status: {any: true}
        booked_at: {any: true}
        location: {any: true}
  invariant:
    - collection: state.messages
      preserve: ALL
    - collection: state.appointments
      filter: "a.id in {x.id for x in initial.appointments}"
      preserve: ALL
    - collection: state.prescriptions
      preserve: ALL
    - collection: state.immunizations
      preserve: ALL
    - collection: state.lab_results
      preserve: ALL
    - collection: state.claims
      preserve: ALL
    - collection: state.referrals
      preserve: ALL
    - collection: state.providers
      preserve: ALL
    - collection: state.patient
      preserve: ALL
    # Bounded-creation guard: the ONLY newly-created appointment permitted is
    # the one booked with the assigned PCP. Any appointment created with a
    # different provider (e.g. the decoy second PCP, or a specialist) is a
    # forbidden extra mutation. Pre-existing appointments are excluded so this
    # only ever fires on agent-created rows. comprehensive:true flags any such
    # unaccounted create as collateral.
    - collection: state.appointments
      filter: >-
        a.id not in {x.id for x in initial.appointments}
        and a.provider_id != target['pcp_id']
      preserve: ALL
      comprehensive: true
  named_invariants:
    - name: "Agent did not modify unrelated messages or send/reply with new ones"
      ref: invariant[0]
      severity: high
    - name: "Agent did not cancel or modify pre-existing appointments"
      ref: invariant[1]
      severity: high
    - name: "Agent did not modify prescriptions"
      ref: invariant[2]
      severity: high
    - name: "Agent did not modify immunization records"
      ref: invariant[3]
      severity: medium
    - name: "Agent did not create or modify lab results"
      ref: invariant[4]
      severity: high
    - name: "Agent did not touch insurance claims"
      ref: invariant[5]
      severity: critical
    - name: "Agent did not touch referrals"
      ref: invariant[6]
      severity: high
    - name: "Agent did not modify provider records"
      ref: invariant[7]
      severity: medium
    - name: "Agent did not modify patient demographics or insurance"
      ref: invariant[8]
      severity: high
    - name: "Agent did not book with the wrong PCP or any other provider"
      ref: invariant[9]
      severity: critical
secondary_primitives: []
